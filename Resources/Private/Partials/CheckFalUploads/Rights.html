<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cfu="http://typo3.org/ns/JWeiland/Checkfaluploads/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:comment>
    <!--
    Rights checkbox of EXT:checkfaluploads for the uploaded images. Rendered
    only, if EXT:checkfaluploads is installed. Its CheckFalUploadValidator
    checks the value "{object}[images][rights]" of the request.
    -->
</f:comment>
<div class="mb-3 form-check">
    <f:form.checkbox name="{object}[images][rights]" value="1" id="{object}-images-rights" class="form-check-input"/>
    <label for="{object}-images-rights" class="form-check-label">
        <cfu:imageRightsMessage/>
    </label>
</div>
</html>
