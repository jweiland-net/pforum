<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:comment><!-- Errors of a single field (Bootstrap 5 invalid-feedback) --></f:comment>
<f:form.validationResults for="{for}">
    <f:if condition="{validationResults.errors}">
        <div class="invalid-feedback d-block">
            <f:for each="{validationResults.errors}" as="error" iteration="iterator">
                {error}<f:if condition="{iterator.isLast}"><f:else><br></f:else></f:if>
            </f:for>
        </div>
    </f:if>
</f:form.validationResults>
</html>
