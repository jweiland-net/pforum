<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:if condition="{pagination.lastPageNumber} > 1">
    <nav aria-label="{f:translate(key: 'pageBrowser')}">
        <ul class="pagination">
            <f:if condition="{paginator.currentPageNumber} > 1">
                <li class="page-item first">
                    <f:render section="renderPageLink"
                              arguments="{linkArguments: {currentPage: 1}, transKey: 'pageBrowser.first', actionName: actionName}"/>
                </li>
            </f:if>
            <f:if condition="{pagination.previousPageNumber}">
                <li class="page-item previous">
                    <f:render section="renderPageLink"
                              arguments="{linkArguments: {currentPage: pagination.previousPageNumber}, transKey: 'pageBrowser.previous', actionName: actionName}"/>
                </li>
            </f:if>
            <li class="page-item active" aria-current="page">
                <span class="page-link">{paginator.currentPageNumber}</span>
            </li>
            <f:if condition="{pagination.nextPageNumber}">
                <li class="page-item next">
                    <f:render section="renderPageLink"
                              arguments="{linkArguments: {currentPage: pagination.nextPageNumber}, transKey: 'pageBrowser.next', actionName: actionName}"/>
                </li>
            </f:if>
            <f:if condition="{paginator.currentPageNumber} < {pagination.lastPageNumber}">
                <li class="page-item last">
                    <f:render section="renderPageLink"
                              arguments="{linkArguments: {currentPage: pagination.lastPageNumber}, transKey: 'pageBrowser.last', actionName: actionName}"/>
                </li>
            </f:if>
        </ul>
    </nav>
</f:if>

<f:section name="renderPageLink">
    <f:variable name="actionName">{f:if(condition: actionName, then: actionName, else: 'list')}</f:variable>
    <f:link.action action="{actionName}" addQueryString="1" arguments="{linkArguments}" class="page-link">
        {f:translate(key: transKey)}
    </f:link.action>
</f:section>
</html>
