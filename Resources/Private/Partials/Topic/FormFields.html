<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<div class="mb-3">
    <label for="title" class="form-label">
        {f:translate(key: 'tx_pforum_domain_model_topic.title')}
        <span class="required">*</span>
    </label>
    <f:form.textfield class="form-control" property="title"/>
</div>

<div class="mb-3">
    <label for="description" class="form-label">
        {f:translate(key: 'tx_pforum_domain_model_topic.description')}
        <span class="required">*</span>
    </label>
    <f:render partial="RichTextEditor/Description" arguments="{id: 'topic-description', richTextEditor: richTextEditor, descriptionPlainText: descriptionPlainText}"/>
</div>

<f:if condition="{settings.useImages}">
    <div class="mb-3">
        <label for="images" class="form-label">
            {f:translate(key: 'tx_pforum_domain_model_topic.images')}
        </label>
        <f:form.upload property="images" multiple="1" class="form-control"/>
    </div>
    <f:if condition="{isCheckFalUploadsLoaded}">
        <f:render partial="CheckFalUploads/Rights" arguments="{object: 'topic'}"/>
    </f:if>
</f:if>
</html>
