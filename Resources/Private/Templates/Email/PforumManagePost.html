<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="SystemEmail"/>

<f:section name="Title">{post.title}</f:section>

<f:section name="Main">
    <p>{f:translate(key: 'email.post.text', extensionName: 'Pforum')}</p>

    <f:if condition="{activationToken}">
        <p>
            <f:link.action pageUid="{settings.pidOfDetailPage}" action="confirmActivation" controller="Post" pluginName="Forum" extensionName="Pforum" absolute="1" arguments="{post: post.uid, token: activationToken}">
                {f:translate(key: 'activatePost', extensionName: 'Pforum')}
            </f:link.action>
        </p>
    </f:if>
    <p>
        <f:link.action pageUid="{settings.pidOfDetailPage}" action="edit" controller="Post" pluginName="Forum" extensionName="Pforum" absolute="1" arguments="{post: post.uid, token: token}">
            {f:translate(key: 'editPost', extensionName: 'Pforum')}
        </f:link.action>
    </p>
    <p>
        <f:link.action pageUid="{settings.pidOfDetailPage}" action="delete" controller="Post" pluginName="Forum" extensionName="Pforum" absolute="1" arguments="{post: post.uid, token: token}">
            {f:translate(key: 'deletePost', extensionName: 'Pforum')}
        </f:link.action>
    </p>
</f:section>
</html>
