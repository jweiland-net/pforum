<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="SystemEmail"/>

<f:section name="Title">{topic.title}</f:section>

<f:section name="Main">
    <p>{f:translate(key: 'email.topic.text', extensionName: 'Pforum')}</p>

    <f:if condition="{activationToken}">
        <p>
            <f:link.action pageUid="{settings.pidOfDetailPage}" action="confirmActivation" controller="Topic" pluginName="Forum" extensionName="Pforum" absolute="1" arguments="{topic: topic.uid, token: activationToken}">
                {f:translate(key: 'activateTopic', extensionName: 'Pforum')}
            </f:link.action>
        </p>
    </f:if>
    <p>
        <f:link.action pageUid="{settings.pidOfDetailPage}" action="edit" controller="Topic" pluginName="Forum" extensionName="Pforum" absolute="1" arguments="{topic: topic.uid, token: token}">
            {f:translate(key: 'editTopic', extensionName: 'Pforum')}
        </f:link.action>
    </p>
    <p>
        <f:link.action pageUid="{settings.pidOfDetailPage}" action="delete" controller="Topic" pluginName="Forum" extensionName="Pforum" absolute="1" arguments="{topic: topic.uid, token: token}">
            {f:translate(key: 'deleteTopic', extensionName: 'Pforum')}
        </f:link.action>
    </p>
</f:section>
</html>
