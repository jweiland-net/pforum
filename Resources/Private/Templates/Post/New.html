<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:formvh="http://typo3.org/ns/TYPO3/CMS/Form/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default"/>

<f:section name="main">
    <f:flashMessages/>

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item">
                <f:link.action action="list" controller="Forum">{f:translate(key: 'tx_pforum_domain_model_forum')}</f:link.action>
            </li>
            <li class="breadcrumb-item">
                <f:link.action action="show" controller="Forum" arguments="{forum: topic.forum}">{topic.forum.title}</f:link.action>
            </li>
            <li class="breadcrumb-item">
                <f:link.action action="show" controller="Topic" arguments="{topic: topic}">{topic.title}</f:link.action>
            </li>
            <li class="breadcrumb-item active" aria-current="page">{f:translate(key: 'newPost')}</li>
        </ol>
    </nav>

    <h2>{f:translate(key: 'newPost')}</h2>

    <f:if condition="{denialReason}">
        <f:then>
            <div class="alert alert-danger" role="alert">
                {f:translate(key: denialReason)}
            </div>
        </f:then>
        <f:else>
            <formvh:render persistenceIdentifier="EXT:pforum/Configuration/Form/Post.form.yaml"
                           factoryClass="JWeiland\\Pforum\\Domain\\Factory\\ArrayFormFactory"
                           overrideConfiguration="{settings.overrideForm.post}"/>
        </f:else>
    </f:if>
</f:section>
</html>
