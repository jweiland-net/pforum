<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:formvh="http://typo3.org/ns/TYPO3/CMS/Form/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default"/>

<f:section name="main">
    <f:flashMessages/>

    <h2>{f:translate(key: 'editPost')}</h2>

    <f:if condition="{denialReason}">
        <f:then>
            <div class="alert alert-danger" role="alert">
                {f:translate(key: denialReason)}
            </div>
        </f:then>
        <f:else>
            <formvh:render persistenceIdentifier="EXT:pforum/Configuration/Form/Post.form.yaml"
                           factoryClass="JWeiland\\Pforum\\Domain\\Factory\\ArrayFormFactory"
                           overrideConfiguration="{settings.overrideForm.post}"/>
        </f:else>
    </f:if>
</f:section>
</html>
