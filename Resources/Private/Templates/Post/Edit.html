<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:pf="http://typo3.org/ns/JWeiland/Pforum/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Default"/>

<f:section name="main">
    <f:flashMessages/>

    <f:if condition="{isPreview}">
        <h3>{f:translate(key: 'preview')}</h3>

        <div class="card mb-3 bg-light">
            <div class="row g-0">
                <f:if condition="{post.images}">
                    <div class="col-md-2">
                        <f:for each="{post.images}" as="image">
                            <f:image image="{image}"
                                     alt="{image.title}"
                                     class="img-fluid rounded-start"
                                     width="{settings.image.width}"
                                     height="{settings.image.height}"
                                     minWidth="{settings.image.minWidth}"
                                     maxWidth="{settings.image.maxWidth}"
                                     minHeight="{settings.image.minHeight}"
                                     maxHeight="{settings.image.maxHeight}"/>
                        </f:for>
                    </div>
                </f:if>

                <f:variable name="columns">{f:if(condition: post.images, then: 10, else: 12)}</f:variable>

                <div class="col-md-{columns}">
                    <div class="card-body">
                        <div class="d-flex w-100 justify-content-between">
                            <h5 class="mb-1">
                                {post.title}
                            </h5>
                            <small>
                                {post.crdate -> f:format.date(format: 'd.m.Y')}&nbsp;|
                                {f:translate(key: 'from')}:
                                <f:render partial="User/Username" arguments="{user: post.user}"/>
                            </small>
                        </div>

                        <div class="card-text"><pf:formatRichText value="{post.description}" table="tx_pforum_domain_model_post" column="description"/></div>
                    </div>
                </div>
            </div>
        </div>
    </f:if>

    <h3>{f:translate(key: 'editPost')}</h3>

    <f:form action="update" name="post" object="{post}" enctype="multipart/form-data">
        <f:render partial="FormErrors" arguments="{object: 'post'}"/>

        <f:if condition="{isNew}">
            <f:form.hidden name="isNew" value="1"/>
        </f:if>
        <f:if condition="{token}">
            <f:form.hidden name="token" value="{token}"/>
        </f:if>

        <f:if condition="{settings.auth} == 1">
            <f:render partial="User/FormFields" arguments="{record: post}"/>
        </f:if>

        <f:render partial="Post/FormFields" arguments="{_all}"/>

        <div class="mb-3">
            <f:form.submit class="btn btn-primary" value="{f:translate(key: f:if(condition: isNew, then: 'publish', else: 'save'))}"/>
            <f:form.submit class="btn btn-secondary" name="preview" value="{f:translate(key: 'preview')}"/>
        </div>
    </f:form>
</f:section>
</html>
