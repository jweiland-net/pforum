categories:
  pforum:
    label: 'pforum'
  pforum.templates:
    label: 'Templates'
    parent: pforum
  pforum.pages:
    label: 'Pages'
    parent: pforum
  pforum.settings:
    label: 'Settings'
    parent: pforum
  pforum.form:
    label: 'Forms of topics and posts'
    parent: pforum
settings:
  pforum.templateRootPath:
    label: 'Templates'
    category: pforum.templates
    description: 'Path to template root'
    type: string
    default: 'EXT:pforum/Resources/Private/Templates/'
  pforum.partialRootPath:
    label: 'Partials'
    category: pforum.templates
    description: 'Path to partial root'
    type: string
    default: 'EXT:pforum/Resources/Private/Partials/'
  pforum.layoutRootPath:
    label: 'Layouts'
    category: pforum.templates
    description: 'Path to layout root'
    type: string
    default: 'EXT:pforum/Resources/Private/Layouts/'
  pforum.storagePid:
    label: 'Default storage PID'
    category: pforum.pages
    description: 'Folder that stores all POIs'
    type: int
    default: 0
  pforum.auth:
    label: 'Authentication method'
    category: pforum.settings
    type: string
    default: '1'
    enum:
      1: 'None'
      2: 'Auth'
  pforum.emailIsMandatory:
    label: 'Email is mandatory'
    category: pforum.settings
    type: bool
    default: false
  pforum.usernameIsMandatory:
    label: 'Username is mandatory'
    category: pforum.settings
    type: bool
    default: false
  pforum.useImages:
    label: 'Use images'
    category: pforum.settings
    type: bool
    default: false
  pforum.uidOfAdminGroup:
    label: 'UID of admin group'
    category: pforum.settings
    type: int
    default: 0
  pforum.uidOfUserGroup:
    label: 'UID of user group'
    category: pforum.settings
    type: int
    default: 0
  pforum.pidOfDetailPage:
    label: 'Page ID of detail page'
    category: pforum.settings
    type: int
    default: 0

  pforum.topic.hideAtCreation:
    label: 'Hide topic at creation'
    category: pforum.settings
    description: 'New topics are hidden until they are activated by an admin or by their author.'
    type: bool
    default: false
  pforum.topic.activateByAdmin:
    label: 'Topic activation by admin'
    category: pforum.settings
    description: 'Hidden topics are activated by members of the admin group or in the backend module only. Otherwise the author gets a link to activate the topic by mail.'
    type: bool
    default: false

  pforum.post.hideAtCreation:
    label: 'Hide post at creation'
    category: pforum.settings
    description: 'New posts are hidden until they are activated by an admin or by their author.'
    type: bool
    default: false
  pforum.post.activateByAdmin:
    label: 'Post activation by admin'
    category: pforum.settings
    description: 'Hidden posts are activated by members of the admin group or in the backend module only. Otherwise the author gets a link to activate the post by mail.'
    type: bool
    default: false

  pforum.new.uploadFolder:
    label: 'Upload folder'
    category: pforum.settings
    type: string
    description: 'Combined identifier of the folder, where the images of topics and posts are stored.'
    default: '1:/user_upload/tx_pforum/'

  pforum.form.richText.enable:
    label: 'Enable rich text editor'
    category: pforum.form
    description: 'Use CKEditor 5 of EXT:rte_ckeditor for the description of topics and posts. Requires EXT:rte_ckeditor.'
    type: bool
    default: false
  pforum.form.richText.elements:
    label: 'Rich text elements'
    category: pforum.form
    description: 'Comma separated names of the fields, which get the rich text editor. Currently only "description" is supported.'
    type: string
    default: 'description'
  pforum.form.richText.translationsPath:
    label: 'Translations of the rich text editor'
    category: pforum.form
    description: 'Folder with the translations of CKEditor 5 (e.g. de.js). Empty: English user interface only.'
    type: string
    default: 'EXT:rte_ckeditor/Resources/Public/Contrib/translations/'

  pforum.image.width:
    label: 'Image width'
    category: pforum.settings
    type: string
    default: '120c'
  pforum.image.height:
    label: 'Image height'
    category: pforum.settings
    type: string
    default: '90c'
  pforum.image.minWidth:
    label: 'Image min width'
    category: pforum.settings
    type: int
    default: 120
  pforum.image.maxWidth:
    label: 'Image max width'
    category: pforum.settings
    type: int
    default: 120
  pforum.image.minHeight:
    label: 'Image min height'
    category: pforum.settings
    type: int
    default: 90
  pforum.image.maxHeight:
    label: 'Image max height'
    category: pforum.settings
    type: int
    default: 90

  pforum.pageBrowser.itemsPerPage:
    label: 'Items per page in pagination'
    category: pforum.settings
    type: int
    default: 15
